name: MELODIA V2.5 Video Production Validation

on:
  push:
    paths:
      - 'melodia_video_production_engine.py'
      - '.github/workflows/video-production-validation.yml'
  pull_request:
    paths:
      - 'melodia_video_production_engine.py'
      - '.github/workflows/video-production-validation.yml'
  workflow_dispatch:

jobs:
  validate-video-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libass9 fonts-dejavu-core fonts-noto-core fonts-noto-extra
      - name: Verify Python syntax
        run: python -m py_compile melodia_video_production_engine.py
      - name: Validate production features and render sample MP4s
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import types
          from pathlib import Path
          from unittest.mock import patch

          stub = types.ModuleType('melodia_cinematic_video_renderer')
          stub.render_video = lambda *args, **kwargs: None
          sys.modules['melodia_cinematic_video_renderer'] = stub
          import melodia_video_production_engine as production

          def fake_render(plan, output, *, width, height, fps, ffmpeg):
              subprocess.run([
                  ffmpeg, '-hide_banner', '-loglevel', 'error', '-y',
                  '-f', 'lavfi', '-i', f'color=c=navy:s={width}x{height}:r={fps}:d=2',
                  '-an', '-c:v', 'libx264', '-preset', 'ultrafast',
                  '-pix_fmt', 'yuv420p', str(output)
              ], check=True)
              return {'version': '2.4'}

          plan = {
              'version': '2.3',
              'scenes': [{'captions': {'en': 'Peace and hope', 'ta': 'அமைதியும் நம்பிக்கையும்'}}],
              'scene_timeline': [{'start_seconds': 0, 'end_seconds': 2, 'duration_seconds': 2}],
              'total_output_duration_seconds': 2,
          }

          def probe(path):
              data = subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_entries',
                  'stream=codec_type,width,height:format=duration',
                  '-of', 'json', str(path)
              ], text=True)
              return json.loads(data)

          # Unlike TemporaryDirectory, these files survive until artifact upload.
          output_dir = Path('artifacts/v25-production-samples')
          output_dir.mkdir(parents=True, exist_ok=True)
          with patch.object(production, 'render_video', fake_render):
              for aspect, dimensions in [('16:9', (1280, 720)), ('9:16', (720, 1280))]:
                  output = output_dir / ('landscape.mp4' if aspect == '16:9' else 'portrait.mp4')
                  result = production.produce_video(plan, output, aspect=aspect, fps=10,
                                                    bilingual_language='ta')
                  assert result['caption_events'] == 1, result
                  assert output.is_file() and output.stat().st_size > 0
                  info = probe(output)
                  video = next(s for s in info['streams'] if s['codec_type'] == 'video')
                  assert (video['width'], video['height']) == dimensions, info
                  assert abs(float(info['format']['duration']) - 2) < 0.5, info
                  print('PASS: bilingual MP4', aspect)

              audio = output_dir / 'test_audio.wav'
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                  '-f', 'lavfi', '-i', 'sine=frequency=440:duration=1',
                  '-c:a', 'pcm_s16le', str(audio)
              ], check=True)
              with_music = output_dir / 'music.mp4'
              production.produce_video(plan, with_music, fps=10, music=audio)
              assert any(s['codec_type'] == 'audio' for s in probe(with_music)['streams'])
              print('PASS: audio muxing')

              silent = output_dir / 'silent.mp4'
              result = production.produce_video(plan, silent, fps=10, captions=False)
              assert result['caption_events'] == 0
              assert not any(s['codec_type'] == 'audio' for s in probe(silent)['streams'])
              print('PASS: captions disabled and silent output')

          def expect_error(expected, callback):
              try:
                  callback()
              except expected:
                  return
              raise AssertionError(f'Expected {expected.__name__}')

          missing = dict(plan, scenes=[{'captions': {'ta': 'வணக்கம்'}}])
          expect_error(ValueError, lambda: production.produce_video(missing, output_dir / 'bad.mp4'))
          expect_error(ValueError, lambda: production.produce_video(plan, output_dir / 'bad.mp4', aspect='4:3'))
          expect_error(ValueError, lambda: production.produce_video(plan, output_dir / 'bad.mp4', music_volume=2, music=output_dir / 'x.wav'))
          expect_error(FileNotFoundError, lambda: production.produce_video(plan, output_dir / 'bad.mp4', music=output_dir / 'x.wav'))
          print('PASS: invalid input handling')

          ass = output_dir / 'captions.ass'
          assert production._make_ass(plan, ass, 1280, 720, 'ta') == 1
          content = ass.read_text(encoding='utf-8')
          assert 'Peace and hope' in content and 'அமைதியும் நம்பிக்கையும்' in content
          print('PASS: bilingual ASS text')
          print('MELODIA V2.5 validation complete')
          PY
      - name: Upload V2.5 sample video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodia-v25-production-samples
          path: artifacts/v25-production-samples/
          if-no-files-found: error
          retention-days: 14
