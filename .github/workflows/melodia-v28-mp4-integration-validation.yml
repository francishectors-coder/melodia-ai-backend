
name: MELODIA V2.8 MP4 Integration Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "melodia_v28_mp4_integration.py"
      - "melodia_prompt_cinematic_integration.py"
      - "melodia_prompt_scene_engine.py"
      - "melodia_video_production_engine.py"
      - "melodia_cinematic_video_renderer.py"
      - "melodia_cinematic_orchestration_engine.py"
      - "melodia_scene_continuity_engine.py"
      - "melodia_camera_movement_engine.py"
      - "melodia_cinematic_transition_engine.py"
      - ".github/workflows/melodia-v28-mp4-integration-validation.yml"

permissions:
  contents: read

jobs:
  validate-mp4-integration:
    name: Validate Prompt-to-MP4 Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-ui-core \
            libcairo2 \
            libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -filters | grep -E ' ass | subtitles '

      - name: Create output directory
        run: |
          mkdir -p validation_output

      - name: Check Python syntax
        run: |
          python -m py_compile \
            melodia_v28_mp4_integration.py \
            melodia_prompt_cinematic_integration.py \
            melodia_prompt_scene_engine.py \
            melodia_video_production_engine.py \
            melodia_cinematic_video_renderer.py \
            melodia_cinematic_orchestration_engine.py

      - name: Verify module imports
        run: |
          python -c "import melodia_v28_mp4_integration; print('V2.8 MP4 integration import successful')"

      - name: Generate test audio
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi \
            -i "sine=frequency=440:sample_rate=44100:duration=20" \
            -c:a pcm_s16le \
            validation_output/test_audio.wav

      - name: Render landscape MP4
        run: |
          python melodia_v28_mp4_integration.py \
            --prompt "A peaceful garden with a house, tree and flower" \
            --output validation_output/melodia_v28_landscape.mp4 \
            --duration 20 \
            --aspect 16:9 \
            --scene-seconds 10 \
            --transition-duration 1 \
            --fps 24 \
            --seed 28

      - name: Render portrait MP4 with audio
        run: |
          python melodia_v28_mp4_integration.py \
            --prompt "A peaceful garden with a house, tree and flower" \
            --output validation_output/melodia_v28_portrait.mp4 \
            --duration 20 \
            --aspect 9:16 \
            --scene-seconds 10 \
            --transition-duration 1 \
            --fps 24 \
            --seed 28 \
            --music validation_output/test_audio.wav

      - name: Validate rendered MP4 files
        run: |
          python - <<'PY'
          import json
          import math
          import subprocess
          from pathlib import Path

          output_dir = Path("validation_output")

          cases = [
              {
                  "name": "landscape",
                  "file": output_dir / "melodia_v28_landscape.mp4",
                  "width": 1280,
                  "height": 720,
                  "duration": 20.0,
                  "audio": False,
              },
              {
                  "name": "portrait",
                  "file": output_dir / "melodia_v28_portrait.mp4",
                  "width": 720,
                  "height": 1280,
                  "duration": 20.0,
                  "audio": True,
              },
          ]

          results = []
          failures = []

          for case in cases:
              path = case["file"]

              if not path.is_file():
                  failures.append(
                      f"{case['name']}: MP4 file missing"
                  )
                  continue

              if path.stat().st_size == 0:
                  failures.append(
                      f"{case['name']}: MP4 file empty"
                  )
                  continue

              command = [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration:stream=index,codec_type,width,height",
                  "-of", "json",
                  str(path),
              ]

              probe = subprocess.run(
                  command,
                  capture_output=True,
                  text=True,
                  check=True,
              )

              metadata = json.loads(probe.stdout)

              streams = metadata.get("streams", [])

              videos = [
                  stream for stream in streams
                  if stream.get("codec_type") == "video"
              ]

              audios = [
                  stream for stream in streams
                  if stream.get("codec_type") == "audio"
              ]

              duration = float(
                  metadata["format"]["duration"]
              )

              if not videos:
                  failures.append(
                      f"{case['name']}: video stream missing"
                  )
                  continue

              video = videos[0]

              width = video.get("width")
              height = video.get("height")

              duration_error = abs(
                  duration - case["duration"]
              )

              if width != case["width"]:
                  failures.append(
                      f"{case['name']}: incorrect width {width}"
                  )

              if height != case["height"]:
                  failures.append(
                      f"{case['name']}: incorrect height {height}"
                  )

              # Allow up to one video frame plus
              # a small container timing tolerance.
              tolerance = (1.0 / 24.0) + 0.02

              if not math.isfinite(duration):
                  failures.append(
                      f"{case['name']}: invalid duration"
                  )
              elif duration_error > tolerance:
                  failures.append(
                      f"{case['name']}: duration "
                      f"{duration:.3f}s instead of "
                      f"{case['duration']:.3f}s"
                  )

              has_audio = bool(audios)

              if has_audio != case["audio"]:
                  failures.append(
                      f"{case['name']}: unexpected audio state"
                  )

              results.append({
                  "name": case["name"],
                  "file": str(path),
                  "file_size_bytes": path.stat().st_size,
                  "width": width,
                  "height": height,
                  "expected_duration_seconds": case["duration"],
                  "actual_duration_seconds": duration,
                  "duration_error_seconds": duration_error,
                  "audio_present": has_audio,
                  "metadata": metadata,
              })

          report = {
              "project": "MELODIA AI",
              "version": "2.8",
              "validation": "MP4 integration",
              "cases": results,
              "failures": failures,
              "passed": len(failures) == 0
                        and len(results) == len(cases),
          }

          report_path = (
              output_dir / "validation_report.json"
          )

          report_path.write_text(
              json.dumps(
                  report,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(json.dumps(report, indent=2))

          if not report["passed"]:
              raise SystemExit(
                  "MELODIA V2.8 MP4 validation failed"
              )

          print(
              "MELODIA V2.8 MP4 VALIDATION PASSED"
          )
          PY

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodia-v28-mp4-validation
          path: validation_output/
          retention-days: 14
          if-no-files-found: warn
