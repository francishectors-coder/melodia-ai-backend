
name: MELODIA V2.8 MP4 Integration Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "melodia_v28_mp4_integration.py"
      - "melodia_instrumental_music_engine.py"
      - "melodia_prompt_cinematic_integration.py"
      - "melodia_prompt_scene_engine.py"
      - "melodia_video_production_engine.py"
      - "melodia_cinematic_video_renderer.py"
      - "melodia_cinematic_orchestration_engine.py"
      - "melodia_scene_continuity_engine.py"
      - "melodia_camera_movement_engine.py"
      - "melodia_cinematic_transition_engine.py"
      - ".github/workflows/melodia-v28-mp4-integration-validation.yml"

permissions:
  contents: read

jobs:
  validate-mp4-integration:
    name: Validate Prompt-to-MP4 Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-ui-core \
            libcairo2 \
            libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg

      - name: Verify FFmpeg and Tamil fonts
        run: |
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -filters | grep -E ' ass | subtitles '
          fc-match 'Noto Sans Tamil'

      - name: Create output directory
        run: |
          mkdir -p validation_output

      - name: Check Python syntax
        run: |
          python -m py_compile \
            melodia_v28_mp4_integration.py \
            melodia_instrumental_music_engine.py \
            melodia_prompt_cinematic_integration.py \
            melodia_prompt_scene_engine.py \
            melodia_video_production_engine.py \
            melodia_cinematic_video_renderer.py \
            melodia_cinematic_orchestration_engine.py

      - name: Verify module imports
        run: |
          python -c "import melodia_v28_mp4_integration; print('V2.8 MP4 integration import successful')"

      - name: Create two-scene Tamil translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          translations = {
              "scene_001": "அமைதியான தோட்டத்தில் ஒரு வீடும் மரமும் மலரும்",
              "scene_002": "இடதுபுறத்தில் ஒரு வீடு",
          }

          path = Path("validation_output/tamil_captions.json")
          path.write_text(
              json.dumps(translations, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Validate scene-specific English and Tamil captions
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          from melodia_prompt_cinematic_integration import generate_cinematic_plan
          from melodia_v28_mp4_integration import prepare_production_plan
          from melodia_video_production_engine import _make_ass

          prompt = "A peaceful garden with a house, tree and flower"

          result = generate_cinematic_plan(
              prompt=prompt,
              duration_seconds=20,
              aspect_ratio="16:9",
              scene_seconds=10,
              transition_duration=1,
              seed=28,
          )

          plan = prepare_production_plan(
              result,
              bilingual_language="ta",
              bilingual_captions="validation_output/tamil_captions.json",
          )

          scenes = plan["scenes"]
          assert len(scenes) == 2, "Expected two scenes"

          english = [scene["captions"]["en"] for scene in scenes]
          tamil = [scene["captions"]["ta"] for scene in scenes]

          assert all(english), "English caption missing"
          assert all(tamil), "Tamil caption missing"
          assert english[0] != english[1], "English captions repeat"
          assert tamil[0] != tamil[1], "Tamil captions repeat"

          path = Path("validation_output/bilingual_captions.ass")
          count = _make_ass(
              plan, path, 1280, 720, bilingual_language="ta"
          )

          ass = path.read_text(encoding="utf-8")
          events = [
              line for line in ass.splitlines()
              if line.startswith("Dialogue:")
          ]

          assert count == 2 and len(events) == 2

          for index, event in enumerate(events):
              assert english[index] in event
              assert tamil[index] in event
              assert r"\N" in event

          assert events[0] != events[1]
          assert re.search(
              r"Dialogue: 0,0:00:00\.00,", events[0]
          )

          report = {
              "english_captions": english,
              "tamil_captions": tamil,
              "ass_events": count,
              "scene_timeline": plan["scene_timeline"],
              "passed": True,
          }

          Path("validation_output/caption_validation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Render landscape bilingual MP4 with automatic music
        run: |
          python melodia_v28_mp4_integration.py \
            --prompt "A peaceful garden with a house, tree and flower" \
            --output validation_output/melodia_v28_landscape.mp4 \
            --duration 20 \
            --aspect 16:9 \
            --scene-seconds 10 \
            --transition-duration 1 \
            --fps 24 \
            --seed 28 \
            --bilingual-language ta \
            --bilingual-captions validation_output/tamil_captions.json

      - name: Render portrait bilingual MP4 with automatic music
        run: |
          python melodia_v28_mp4_integration.py \
            --prompt "A peaceful garden with a house, tree and flower" \
            --output validation_output/melodia_v28_portrait.mp4 \
            --duration 20 \
            --aspect 9:16 \
            --scene-seconds 10 \
            --transition-duration 1 \
            --fps 24 \
            --seed 28 \
            --bilingual-language ta \
            --bilingual-captions validation_output/tamil_captions.json

      - name: Render landscape bilingual MP4 without music
        run: |
          python melodia_v28_mp4_integration.py \
            --prompt "A peaceful garden with a house, tree and flower" \
            --output validation_output/melodia_v28_silent.mp4 \
            --duration 20 \
            --aspect 16:9 \
            --scene-seconds 10 \
            --transition-duration 1 \
            --fps 24 \
            --seed 28 \
            --bilingual-language ta \
            --bilingual-captions validation_output/tamil_captions.json \
            --no-music

      - name: Validate rendered MP4 files
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          import subprocess
          from pathlib import Path

          output_dir = Path("validation_output")

          cases = [
              {
                  "name": "landscape",
                  "file": output_dir / "melodia_v28_landscape.mp4",
                  "width": 1280,
                  "height": 720,
                  "duration": 20.0,
                  "audio": True,
              },
              {
                  "name": "portrait",
                  "file": output_dir / "melodia_v28_portrait.mp4",
                  "width": 720,
                  "height": 1280,
                  "duration": 20.0,
                  "audio": True,
              },
              {
                  "name": "silent",
                  "file": output_dir / "melodia_v28_silent.mp4",
                  "width": 1280,
                  "height": 720,
                  "duration": 20.0,
                  "audio": False,
              },
          ]

          results = []
          failures = []

          for case in cases:
              path = case["file"]

              if not path.is_file() or path.stat().st_size == 0:
                  failures.append(
                      f"{case['name']}: MP4 missing or empty"
                  )
                  continue

              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries",
                      "format=duration:stream=index,codec_type,width,height",
                      "-of", "json", str(path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              metadata = json.loads(probe.stdout)
              streams = metadata.get("streams", [])

              videos = [
                  stream for stream in streams
                  if stream.get("codec_type") == "video"
              ]

              audios = [
                  stream for stream in streams
                  if stream.get("codec_type") == "audio"
              ]

              if not videos:
                  failures.append(
                      f"{case['name']}: video stream missing"
                  )
                  continue

              video = videos[0]
              duration = float(metadata["format"]["duration"])
              tolerance = (1.0 / 24.0) + 0.02

              if video.get("width") != case["width"]:
                  failures.append(
                      f"{case['name']}: incorrect width"
                  )

              if video.get("height") != case["height"]:
                  failures.append(
                      f"{case['name']}: incorrect height"
                  )

              if (
                  not math.isfinite(duration)
                  or abs(duration - case["duration"]) > tolerance
              ):
                  failures.append(
                      f"{case['name']}: incorrect duration {duration}"
                  )

              if bool(audios) != case["audio"]:
                  failures.append(
                      f"{case['name']}: unexpected audio state"
                  )

              def frame_digest(seconds):
                  frame = subprocess.run(
                      [
                          "ffmpeg",
                          "-hide_banner",
                          "-loglevel", "error",
                          "-ss", str(seconds),
                          "-i", str(path),
                          "-frames:v", "1",
                          "-f", "rawvideo",
                          "-pix_fmt", "rgb24",
                          "-",
                      ],
                      capture_output=True,
                      check=True,
                  ).stdout

                  if not frame:
                      raise ValueError(
                          f"No frame at {seconds}s"
                      )

                  return hashlib.sha256(frame).hexdigest()

              for scene_label, timestamps in (
                  ("first", (2, 5, 8)),
                  ("second", (12, 15, 18)),
              ):
                  digests = [
                      frame_digest(t) for t in timestamps
                  ]

                  if len(set(digests)) != 1:
                      failures.append(
                          f"{case['name']}: "
                          f"{scene_label} scene is not static"
                      )

              results.append({
                  "name": case["name"],
                  "file": str(path),
                  "file_size_bytes": path.stat().st_size,
                  "width": video.get("width"),
                  "height": video.get("height"),
                  "expected_duration_seconds": case["duration"],
                  "actual_duration_seconds": duration,
                  "audio_present": bool(audios),
              })

          report = {
              "project": "MELODIA AI",
              "version": "2.8",
              "validation": "Automatic music in both aspect ratios, silent mode, bilingual captions and static scenes",
              "cases": results,
              "failures": failures,
              "passed": not failures and len(results) == len(cases),
          }

          (output_dir / "validation_report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print(json.dumps(report, ensure_ascii=False, indent=2))

          if not report["passed"]:
              raise SystemExit(
                  "MELODIA V2.8 MP4 validation failed"
              )

          print(
              "MELODIA V2.8 PORTRAIT AND LANDSCAPE "
              "AUTOMATIC MUSIC VALIDATION PASSED"
          )
          PY

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodia-v28-mp4-validation
          path: validation_output/
          retention-days: 14
          if-no-files-found: warn
