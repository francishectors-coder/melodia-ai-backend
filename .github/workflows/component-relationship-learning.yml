
name: MELODIA AI - Component Relationship Learning

on:
  push:
    branches:
      - main
    paths:
      - "melodia_component_relationship_learner.py"
      - "melodia_geometric_object_learner.py"
      - ".github/workflows/component-relationship-learning.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-multiscale-relationships:
    name: Validate Five Categories at Three Scales
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python syntax
        run: |
          python -m py_compile \
            melodia_geometric_object_learner.py \
            melodia_component_relationship_learner.py

      - name: Generate fifteen object layouts
        run: |
          set -e

          for object in tree house vehicle animal flower
          do
            for setting in "50:0.5" "100:1.0" "150:1.5"
            do
              label="${setting%%:*}"
              scale="${setting#*:}"

              echo "Generating $object at ${label}%"

              python melodia_component_relationship_learner.py \
                --object "$object" \
                --scale "$scale" \
                --output "melodia_relationship_tests/${object}/scale_${label}"
            done
          done

      - name: Test unknown object handling
        run: |
          python melodia_component_relationship_learner.py \
            --object unknown_object \
            --output melodia_relationship_tests/unknown

      - name: Validate scaling and attachment consistency
        run: |
          python - <<'PY'
          import json
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("melodia_relationship_tests")

          categories = [
              "tree", "house", "vehicle", "animal", "flower"
          ]

          scales = {
              "50": 0.5,
              "100": 1.0,
              "150": 1.5
          }

          tolerance = 0.00001
          results = []

          def close(a, b):
              return math.isclose(
                  a, b, rel_tol=tolerance, abs_tol=tolerance
              )

          def load_representation(category, label):
              folder = root / category / f"scale_{label}"

              for filename in (
                  "relationship_model.json",
                  "relationship_representation.json",
                  "relationship_preview.svg"
              ):
                  path = folder / filename
                  assert path.is_file(), f"Missing: {path}"
                  assert path.stat().st_size > 0, f"Empty: {path}"

              data = json.loads(
                  (folder / "relationship_representation.json")
                  .read_text(encoding="utf-8")
              )

              assert data.get("status") == "generated"
              assert data.get("object") == category

              svg = ET.parse(
                  folder / "relationship_preview.svg"
              ).getroot()

              assert svg.tag.endswith("svg")

              return data, svg

          for category in categories:
              baseline, _ = load_representation(
                  category, "100"
              )

              base_parts = {
                  part["role"]: part
                  for part in baseline["components"]
              }

              assert len(base_parts) >= 2
              assert len(base_parts) == len(
                  baseline["components"]
              )

              for label, scale in scales.items():
                  data, svg = load_representation(
                      category, label
                  )

                  assert close(data["scale"], scale)

                  parts = {
                      part["role"]: part
                      for part in data["components"]
                  }

                  assert set(parts) == set(base_parts)

                  for role, part in parts.items():
                      original = base_parts[role]

                      assert part["parent"] == original["parent"]
                      assert part["shape"] == original["shape"]

                      for field in (
                          "x", "y", "width", "height"
                      ):
                          assert math.isfinite(part[field]), (
                              category, label, role, field
                          )

                      assert close(
                          part["width"],
                          original["width"] * scale
                      )

                      assert close(
                          part["height"],
                          original["height"] * scale
                      )

                      parent_role = part["parent"]

                      if parent_role is not None:
                          assert parent_role in parts

                          parent = parts[parent_role]
                          base_parent = base_parts[parent_role]

                          for axis in ("x", "y"):
                              offset = (
                                  part[axis] - parent[axis]
                              )

                              base_offset = (
                                  original[axis]
                                  - base_parent[axis]
                              )

                              assert close(
                                  offset,
                                  base_offset * scale
                              ), (
                                  category, label, role, axis
                              )

                  # Check that every circle is actually
                  # represented by an SVG circle element.
                  svg_circles = [
                      element
                      for element in svg.iter()
                      if element.tag.split("}")[-1] == "circle"
                  ]

                  expected_circles = sum(
                      part["shape"] == "circle"
                      for part in parts.values()
                  )

                  assert len(svg_circles) == expected_circles

                  for circle in svg_circles:
                      radius = float(circle.attrib["r"])
                      assert math.isfinite(radius)
                      assert radius > 0

                  results.append({
                      "object": category,
                      "scale": scale,
                      "components": len(parts),
                      "status": "pass"
                  })

                  print(
                      "PASS:",
                      category,
                      f"{scale:.1f}x",
                      "| components:",
                      len(parts)
                  )

          unknown_path = (
              root / "unknown"
              / "relationship_representation.json"
          )

          unknown = json.loads(
              unknown_path.read_text(encoding="utf-8")
          )

          assert unknown.get("status") == "unknown"

          report = {
              "project": "MELODIA AI",
              "test": "multiscale_component_relationships",
              "categories": len(categories),
              "scales_per_category": len(scales),
              "total_layouts": len(results),
              "unknown_object_handling": "pass",
              "results": results
          }

          (root / "multiscale_validation_report.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8"
          )

          print("ALL 15 MULTI-SCALE TESTS PASSED")
          PY

      - name: Upload multi-scale artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodia-multiscale-relationships
          path: melodia_relationship_tests/
          retention-days: 30
          if-no-files-found: warn

      - name: Write workflow summary
        if: success()
        run: |
          echo "## MELODIA Multi-Scale Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "15 layouts validated successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Five categories at 50%, 100%, and 150% scale." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Component sizes and parent-relative offsets verified." >> "$GITHUB_STEP_SUMMARY"
          echo "SVG circle elements verified." >> "$GITHUB_STEP_SUMMARY"
          echo "Unknown-object handling verified." >> "$GITHUB_STEP_SUMMARY"
