
name: MELODIA V2.7 Gemini Image Generation Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gemini-image:
    name: Validate Gemini Image Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai Pillow

      - name: Verify Python syntax
        run: |
          python -m py_compile melodia_ai_image_generator.py

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is missing."
            exit 1
          fi
          echo "Gemini API key is configured."

      - name: Generate real Gemini image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python melodia_ai_image_generator.py

      - name: Validate generated PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("generated_visuals/gemini_test.png")
          if not path.is_file():
              raise SystemExit("FAIL: Gemini image not found")

          with Image.open(path) as image:
              image.verify()

          with Image.open(path) as image:
              print("Image format:", image.format)
              print("Image dimensions:", image.size)
              assert image.format == "PNG"
              assert image.width > 0
              assert image.height > 0

          print("MELODIA GEMINI IMAGE VALIDATION PASSED")
          PY

      - name: Upload generated image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: melodia-v27-gemini-generated-image
          path: generated_visuals/gemini_test.png
          if-no-files-found: error
          retention-days: 7
