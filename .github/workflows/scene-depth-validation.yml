
name: MELODIA AI - Scene Depth Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "melodia_scene_depth_engine.py"
      - "melodia_automatic_scene_composer.py"
      - "melodia_spatial_relationship_engine.py"
      - "melodia_prompt_scene_generator.py"
      - "melodia_automatic_structure_learner.py"
      - "melodia_component_relationship_learner.py"
      - "melodia_geometric_object_learner.py"
      - ".github/workflows/scene-depth-validation.yml"

jobs:
  validate-scene-depth:
    name: Validate MELODIA V1.9
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V1.9 validation
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import json
          import math
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          from melodia_geometric_object_learner import EXAMPLES
          from melodia_automatic_structure_learner import learn_all

          from melodia_automatic_scene_composer import (
              compose_scene,
              object_bounds,
          )

          from melodia_scene_depth_engine import (
              VERSION,
              DEPTH_LAYERS,
              DEFAULT_DEPTH,
              detect_depth_assignments,
              transform_object_depth,
              validate_depth_geometry,
              generate_depth_scene,
              render_depth_svg,
          )

          OUTPUT = Path("melodia_scene_depth_validation")
          OUTPUT.mkdir(parents=True, exist_ok=True)

          learned = learn_all(EXAMPLES)
          results = []
          EPS = 0.00001

          def check(condition, message):
              if not condition:
                  raise AssertionError(message)

          def run_test(name, function):
              try:
                  details = function()
                  results.append({
                      "test": name,
                      "status": "pass",
                      "details": details,
                  })
                  print("PASS:", name)
              except Exception as exc:
                  results.append({
                      "test": name,
                      "status": "fail",
                      "error": (
                          f"{type(exc).__name__}: {exc}"
                      ),
                  })
                  print("FAIL:", name, repr(exc))

          def expect_value_error(function):
              try:
                  function()
              except ValueError:
                  return
              raise AssertionError(
                  "Expected ValueError"
              )

          def scene(prompt, seed=1337, variation=0.5):
              return generate_depth_scene(
                  prompt,
                  learned,
                  seed=seed,
                  variation=variation,
              )

          def save_scene(name, prompt):
              result = scene(prompt)

              check(
                  result["status"] == "generated",
                  "Scene was not generated",
              )

              folder = OUTPUT / "scenes" / name
              folder.mkdir(parents=True, exist_ok=True)

              (folder / "depth_scene.json").write_text(
                  json.dumps(result, indent=2),
                  encoding="utf-8",
              )

              svg = render_depth_svg(result)

              (folder / "depth_scene.svg").write_text(
                  svg,
                  encoding="utf-8",
              )

              return result

          def find_category(result, category):
              matches = [
                  obj for obj in result["objects"]
                  if obj["category"] == category
              ]

              check(
                  len(matches) == 1,
                  f"Expected one {category}",
              )

              return matches[0]

          def verify_depth_order(result):
              orders = [
                  obj["depth_order"]
                  for obj in result["objects"]
              ]

              check(
                  orders == sorted(orders),
                  "Objects not ordered back-to-front",
              )

              return orders

          # Tests 1-3: Explicit depth assignments.
          for depth, prompt in (
              (
                  "background",
                  "A tree in the background",
              ),
              (
                  "middle",
                  "A tree in the middle ground",
              ),
              (
                  "foreground",
                  "A tree in the foreground",
              ),
          ):
              def explicit_test(
                  depth=depth,
                  prompt=prompt,
              ):
                  result = save_scene(
                      f"explicit_{depth}",
                      prompt,
                  )

                  obj = find_category(
                      result, "tree"
                  )

                  check(
                      obj["depth"] == depth,
                      "Incorrect explicit depth",
                  )

                  return {"depth": depth}

              run_test(
                  f"explicit_{depth}",
                  explicit_test,
              )

          # Test 4: Three depth layers.
          def three_layer_test():
              result = save_scene(
                  "three_layers",
                  "A tree in the background, "
                  "a house in the middle ground, "
                  "and a flower in the foreground "
                  "at sunset",
              )

              expected = {
                  "tree": "background",
                  "house": "middle",
                  "flower": "foreground",
              }

              for category, depth in expected.items():
                  obj = find_category(
                      result, category
                  )

                  check(
                      obj["depth"] == depth,
                      f"Incorrect depth for {category}",
                  )

              verify_depth_order(result)

              return expected

          run_test(
              "three_layer_assignment",
              three_layer_test,
          )

          # Test 5: Default depth assignments.
          def default_depth_test():
              result = save_scene(
                  "default_depth",
                  "A tree beside a house "
                  "and a flower",
              )

              actual = {
                  obj["category"]: obj["depth"]
                  for obj in result["objects"]
              }

              for category, depth in actual.items():
                  check(
                      depth == DEFAULT_DEPTH[category],
                      f"Incorrect default for {category}",
                  )

              return actual

          run_test(
              "default_depth_assignment",
              default_depth_test,
          )

          # Test 6: Perspective scale.
          def perspective_scale_test():
              base = compose_scene(
                  "A tree",
                  learned,
              )

              original = base["objects"][0]

              transformed = {
                  depth: transform_object_depth(
                      original, depth
                  )
                  for depth in DEPTH_LAYERS
              }

              widths = {}

              for depth, obj in transformed.items():
                  bounds = object_bounds(obj)

                  widths[depth] = (
                      bounds[2] - bounds[0]
                  )

              check(
                  widths["background"]
                  < widths["middle"]
                  < widths["foreground"],
                  "Perspective scaling incorrect",
              )

              return widths

          run_test(
              "perspective_scaling",
              perspective_scale_test,
          )

          # Test 7: Depth ground positions.
          def depth_ground_test():
              base = compose_scene(
                  "A tree",
                  learned,
              )

              original = base["objects"][0]
              measurements = {}

              for depth, settings in DEPTH_LAYERS.items():
                  obj = transform_object_depth(
                      original, depth
                  )

                  bottom = object_bounds(obj)[3]

                  check(
                      abs(
                          bottom - settings["ground_y"]
                      ) <= EPS,
                      f"Incorrect {depth} ground position",
                  )

                  measurements[depth] = bottom

              return measurements

          run_test(
              "depth_ground_positions",
              depth_ground_test,
          )

          # Test 8: Layer ordering.
          def ordering_test():
              result = scene(
                  "A flower in the foreground, "
                  "a tree in the background, "
                  "and a house in the middle ground"
              )

              return {
                  "orders": verify_depth_order(result)
              }

          run_test(
              "back_to_front_ordering",
              ordering_test,
          )

          # Test 9: SVG object groups.
          def svg_group_test():
              result = save_scene(
                  "svg_groups",
                  "A tree in the background "
                  "and a flower in the foreground",
              )

              svg = render_depth_svg(result)

              root = ET.fromstring(svg)

              ns = "{http://www.w3.org/2000/svg}"

              groups = [
                  element
                  for element in root
                  if element.tag == ns + "g"
              ]

              ids = [
                  group.get("id")
                  for group in groups
              ]

              expected = [
                  obj["id"]
                  for obj in result["objects"]
              ]

              check(
                  ids == expected,
                  "SVG groups are not in depth order",
              )

              return {"group_ids": ids}

          run_test(
              "svg_layer_order",
              svg_group_test,
          )

          # Test 10: Canvas geometry.
          def canvas_test():
              result = save_scene(
                  "canvas",
                  "A tree in the background, "
                  "a house in the middle ground, "
                  "and a flower in the foreground",
              )

              validate_depth_geometry(result)

              bounds = {}

              for obj in result["objects"]:
                  box = object_bounds(obj)

                  check(
                      all(math.isfinite(v) for v in box),
                      "Non-finite bounds",
                  )

                  check(
                      box[0] >= -EPS
                      and box[1] >= -EPS
                      and box[2] <= 1 + EPS
                      and box[3] <= 1 + EPS,
                      "Object outside canvas",
                  )

                  bounds[obj["id"]] = box

              return bounds

          run_test(
              "canvas_boundaries",
              canvas_test,
          )

          # Test 11: Seed reproducibility.
          def reproducibility_test():
              prompt = (
                  "A tree in the background "
                  "and a flower in the foreground"
              )

              first = scene(
                  prompt, seed=77, variation=0.8
              )

              second = scene(
                  prompt, seed=77, variation=0.8
              )

              check(
                  first == second,
                  "JSON scenes differ",
              )

              check(
                  render_depth_svg(first)
                  == render_depth_svg(second),
                  "SVG output differs",
              )

              return {"reproducible": True}

          run_test(
              "seed_reproducibility",
              reproducibility_test,
          )

          # Test 12: Original object immutability.
          def immutability_test():
              base = compose_scene(
                  "A tree",
                  learned,
              )

              original = base["objects"][0]
              snapshot = copy.deepcopy(original)

              transform_object_depth(
                  original, "background"
              )

              check(
                  original == snapshot,
                  "Source object was modified",
              )

              return {"unchanged": True}

          run_test(
              "source_immutability",
              immutability_test,
          )

          # Test 13: Unsupported depth.
          def invalid_depth_test():
              base = compose_scene(
                  "A tree",
                  learned,
              )

              expect_value_error(
                  lambda: transform_object_depth(
                      base["objects"][0],
                      "underwater",
                  )
              )

          run_test(
              "reject_invalid_depth",
              invalid_depth_test,
          )

          # Test 14: Invalid geometry.
          def invalid_geometry_test():
              result = scene("A tree")

              result["objects"][0]["components"][0]["x"] = 5.0

              expect_value_error(
                  lambda: validate_depth_geometry(result)
              )

          run_test(
              "reject_outside_canvas",
              invalid_geometry_test,
          )

          # Test 15: Unsupported prompt.
          def unsupported_test():
              result = scene(
                  "A mountain beside an ocean"
              )

              check(
                  result["status"] == "unsupported",
                  "Unsupported prompt was accepted",
              )

              return {"status": result["status"]}

          run_test(
              "unsupported_prompt",
              unsupported_test,
          )

          # Test 16: Invalid variation.
          def invalid_variation_test():
              expect_value_error(
                  lambda: scene(
                      "A tree", variation=2.0
                  )
              )

          run_test(
              "reject_invalid_variation",
              invalid_variation_test,
          )

          # Test 17: Empty prompt.
          def empty_prompt_test():
              expect_value_error(
                  lambda: scene("")
              )

          run_test(
              "reject_empty_prompt",
              empty_prompt_test,
          )

          # Test 18: Command-line export.
          def cli_test():
              folder = OUTPUT / "cli_output"

              subprocess.run(
                  [
                      sys.executable,
                      "melodia_scene_depth_engine.py",
                      "--prompt",
                      "A tree in the background "
                      "and a flower in the foreground",
                      "--output",
                      str(folder),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )

              json_file = folder / "depth_scene.json"
              svg_file = folder / "depth_scene.svg"

              check(
                  json_file.exists(),
                  "CLI JSON missing",
              )

              check(
                  svg_file.exists(),
                  "CLI SVG missing",
              )

              exported = json.loads(
                  json_file.read_text(
                      encoding="utf-8"
                  )
              )

              check(
                  exported["version"] == VERSION,
                  "Incorrect CLI version",
              )

              ET.fromstring(
                  svg_file.read_text(
                      encoding="utf-8"
                  )
              )

              return {"cli": "passed"}

          run_test(
              "command_line_export",
              cli_test,
          )

          # Test 19: Repeated-category depth assignment.
          # A failure identifies a known V1.9 limitation.
          def repeated_category_test():
              result = save_scene(
                  "repeated_category",
                  "A tree in the background "
                  "and another tree in the foreground",
              )

              trees = [
                  obj for obj in result["objects"]
                  if obj["category"] == "tree"
              ]

              check(
                  len(trees) == 2,
                  "Expected two trees",
              )

              depths = sorted(
                  obj["depth"] for obj in trees
              )

              check(
                  depths == [
                      "background", "foreground"
                  ],
                  "Repeated-category depth assignment failed",
              )

              return {"depths": depths}

          run_test(
              "repeated_category_depth",
              repeated_category_test,
          )

          # Test 20: Spatial relationship consistency.
          # Perspective may change object centers; detect
          # rather than silently ignore broken relationships.
          def spatial_consistency_test():
              result = save_scene(
                  "spatial_consistency",
                  "A tree to the left of a house "
                  "and a flower to the right of the house",
              )

              objects = {
                  obj["id"]: obj
                  for obj in result["objects"]
              }

              checked = 0

              for relation in result["relationships"]:
                  subject = objects[relation["subject"]]
                  target = objects[relation["target"]]

                  sx = subject["center"]["x"]
                  tx = target["center"]["x"]

                  if relation["relation"] == "left_of":
                      check(
                          sx < tx,
                          "Left relationship broken",
                      )
                      checked += 1

                  elif relation["relation"] == "right_of":
                      check(
                          sx > tx,
                          "Right relationship broken",
                      )
                      checked += 1

              check(
                  checked >= 2,
                  "Expected two spatial relations",
              )

              return {
                  "relationships_checked": checked
              }

          run_test(
              "spatial_relationship_consistency",
              spatial_consistency_test,
          )

          report = {
              "project": "MELODIA AI",
              "version": VERSION,
              "suite": "scene_depth_validation",
              "total_tests": len(results),
              "passed": sum(
                  item["status"] == "pass"
                  for item in results
              ),
              "failed": sum(
                  item["status"] == "fail"
                  for item in results
              ),
              "results": results,
          }

          (OUTPUT / "validation_report.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8",
          )

          print()
          print("MELODIA V1.9 VALIDATION SUMMARY")
          print(json.dumps({
              "total": report["total_tests"],
              "passed": report["passed"],
              "failed": report["failed"],
          }, indent=2))

          if report["failed"]:
              sys.exit(1)
          PY

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodia-scene-depth-validation
          path: melodia_scene_depth_validation/
          if-no-files-found: warn
          retention-days: 30
