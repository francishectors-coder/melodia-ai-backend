
name: MELODIA AI - Unattended Neural Model Training

on:
  push:
    branches:
      - main
    paths:
      - "melodia_geometric_training.py"
      - "melodia_geometric_model_trainer.py"
      - "melodia_geometric_generalization_test.py"
      - ".github/workflows/geometric-model-training.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: melodia-geometric-model-training
  cancel-in-progress: false

jobs:
  train-model:
    name: Train and Evaluate Geometric Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile melodia_geometric_training.py
          python -m py_compile melodia_geometric_model_trainer.py
          python -m py_compile melodia_geometric_generalization_test.py

      - name: Generate training and evaluation datasets
        run: |
          python melodia_geometric_training.py \
            --output melodia_training_output \
            --train-count 2000 \
            --eval-count 200 \
            --seed 1337

      - name: Train lightweight neural network
        run: |
          python melodia_geometric_model_trainer.py \
            --data melodia_training_output \
            --output melodia_model_output \
            --epochs 15 \
            --learning-rate 0.03 \
            --seed 1337

      - name: Verify trained model
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          folder = Path("melodia_model_output")
          model_file = folder / "model.json"
          report_file = folder / "training_report.json"

          assert model_file.is_file()
          assert report_file.is_file()

          model = json.loads(
              model_file.read_text(encoding="utf-8")
          )

          report = json.loads(
              report_file.read_text(encoding="utf-8")
          )

          assert model["version"] == "1.0"
          assert len(model["model"]["classes"]) == 5
          assert report["training_examples"] == 2000
          assert report["evaluation_examples"] == 200
          assert len(report["history"]) == 15

          accuracy = report["final_accuracy"]

          assert math.isfinite(accuracy)
          assert 0.0 <= accuracy <= 1.0
          assert accuracy >= 0.80

          print("Training evaluation accuracy:", accuracy)
          print("TRAINED MODEL VALIDATION PASSED")
          PY

      - name: Test unfamiliar language descriptions
        run: |
          python melodia_geometric_generalization_test.py \
            --model melodia_model_output/model.json \
            --output melodia_generalization_output

      - name: Verify generalization report
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          report_file = Path(
              "melodia_generalization_output/generalization_report.json"
          )

          assert report_file.is_file()

          report = json.loads(
              report_file.read_text(encoding="utf-8")
          )

          assert report["total"] == 25
          assert len(report["results"]) == 25
          assert 0 <= report["correct"] <= 25

          accuracy = report["accuracy"]

          assert math.isfinite(accuracy)
          assert 0.0 <= accuracy <= 1.0

          print("GENERALIZATION TEST COMPLETED")
          print("Correct:", report["correct"])
          print("Total:", report["total"])
          print("Generalization accuracy:", f"{accuracy:.2%}")
          PY

      - name: Save trained model and evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodia-trained-geometric-model
          path: melodia_model_output/
          retention-days: 30
          if-no-files-found: warn

      - name: Save language generalization results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melodia-language-generalization-results
          path: melodia_generalization_output/
          retention-days: 30
          if-no-files-found: warn

      - name: Training and generalization summary
        if: success()
        run: |
          echo "## MELODIA Geometric Intelligence" >> "$GITHUB_STEP_SUMMARY"
          echo "Neural training completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Language generalization test completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Model and evaluation reports uploaded." >> "$GITHUB_STEP_SUMMARY"
